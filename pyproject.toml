[project]
name = "localgh"
version = "0.1.0"
description = "Agente local (Ollama) que gestiona issues de GitHub con semaforo y cola offline"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
localgh = "localgh.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
