<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="Helvetica,Arial,sans-serif">
<rect width="1100" height="640" fill="#ffffff"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="550" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">Ender 3 (Creality 4.2.2) + D1 mini Pro: flujo de datos y cableado</text>

<!-- PC -->
<rect x="30" y="90" width="160" height="70" rx="8" fill="#e8eef7" stroke="#345"/>
<text x="110" y="120" text-anchor="middle" font-size="16" fill="#111">PC (USB)</text>
<text x="110" y="142" text-anchor="middle" font-size="12" fill="#333">opcional, uno a la vez</text>

<!-- USB1 -->
<rect x="30" y="230" width="160" height="80" rx="8" fill="#e8eef7" stroke="#345"/>
<text x="110" y="262" text-anchor="middle" font-size="16" fill="#111">micro-USB (USB1)</text>
<text x="110" y="284" text-anchor="middle" font-size="12" fill="#333">D+ / D− / VBUS 5 V / GND</text>
<line x1="110" y1="160" x2="110" y2="228" stroke="#333" stroke-width="2"/>

<!-- CH340 -->
<rect x="290" y="200" width="200" height="140" rx="8" fill="#fff4d6" stroke="#875"/>
<text x="390" y="228" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">CH340G (U9)</text>
<text x="390" y="252" text-anchor="middle" font-size="12" fill="#333">pin 5/6 ← D+ / D−</text>
<text x="390" y="272" text-anchor="middle" font-size="12" fill="#333">pin 2 TXD (sale al MCU)</text>
<text x="390" y="292" text-anchor="middle" font-size="12" fill="#333">pin 3 RXD (entra del MCU)</text>
<text x="390" y="312" text-anchor="middle" font-size="12" fill="#333">pin 1 GND · pin 16 = 3,3 V</text>
<line x1="190" y1="270" x2="288" y2="270" stroke="#333" stroke-width="2"/>

<!-- MCU -->
<rect x="700" y="200" width="200" height="140" rx="8" fill="#e3f4e6" stroke="#463"/>
<text x="800" y="228" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">GD32F303 (Marlin)</text>
<text x="800" y="256" text-anchor="middle" font-size="12" fill="#333">USART1 · SERIAL_PORT 1</text>
<text x="800" y="276" text-anchor="middle" font-size="12" fill="#333">PA10 = RX  ← pin 2</text>
<text x="800" y="296" text-anchor="middle" font-size="12" fill="#333">PA9 = TX  → pin 3</text>
<text x="800" y="316" text-anchor="middle" font-size="12" fill="#333">250000 baudios</text>
<line x1="490" y1="262" x2="698" y2="262" stroke="#1a5fb4" stroke-width="2.5"/>
<text x="594" y="254" text-anchor="middle" font-size="12" fill="#1a5fb4">comandos (G-code)</text>
<line x1="698" y1="300" x2="492" y2="300" stroke="#c01c28" stroke-width="2.5"/>
<text x="594" y="318" text-anchor="middle" font-size="12" fill="#c01c28">respuestas / temperaturas</text>

<!-- ESP -->
<rect x="290" y="450" width="200" height="130" rx="8" fill="#f3e6f7" stroke="#639"/>
<text x="390" y="478" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">D1 mini Pro (ESP8266)</text>
<text x="390" y="504" text-anchor="middle" font-size="12" fill="#333">ESP3D · 250000 baudios</text>
<text x="390" y="524" text-anchor="middle" font-size="12" fill="#333">TX → soldado a pin 2 del CH340G</text>
<text x="390" y="544" text-anchor="middle" font-size="12" fill="#333">RX ← soldado a pin 3 del CH340G</text>
<text x="390" y="564" text-anchor="middle" font-size="12" fill="#333">5V ← 5 V de USB1 / EXP1 · G ← GND</text>

<!-- ESP wires -->
<line x1="350" y1="448" x2="350" y2="346" stroke="#1a5fb4" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="340" y="400" text-anchor="end" font-size="12" fill="#1a5fb4">TX ESP → pin 2</text>
<line x1="430" y1="342" x2="430" y2="444" stroke="#c01c28" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="440" y="400" font-size="12" fill="#c01c28">pin 3 → RX ESP</text>

<!-- WiFi -->
<rect x="680" y="470" width="220" height="90" rx="8" fill="#e8eef7" stroke="#345"/>
<text x="790" y="500" text-anchor="middle" font-size="16" fill="#111">Tu WiFi</text>
<text x="790" y="524" text-anchor="middle" font-size="12" fill="#333">navegador / OctoPrint /</text>
<text x="790" y="542" text-anchor="middle" font-size="12" fill="#333">control remoto</text>
<line x1="492" y1="515" x2="678" y2="515" stroke="#333" stroke-width="2"/>

<text x="30" y="620" font-size="12" fill="#a00">Aviso: según el esquema, pin 16 del CH340G es 3,3 V. El 5 V del ESP sale de USB1 (VBUS) o de EXP1, no del pin 16.</text>
<polygon points="110,228 104,216 116,216" fill="#333"/><polygon points="288,270 276,264 276,276" fill="#333"/><polygon points="698,262 686,256 686,268" fill="#1a5fb4"/><polygon points="492,300 504,294 504,306" fill="#c01c28"/><polygon points="350,346 344,358 356,358" fill="#1a5fb4"/><polygon points="430,444 424,432 436,432" fill="#c01c28"/><polygon points="678,515 666,509 666,521" fill="#333"/><polygon points="492,515 504,509 504,521" fill="#333"/></svg>
